services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: astock-codex:latest
    restart: unless-stopped
    ports:
      - "8600:8600"
    environment:
      TZ: Asia/Shanghai
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      # Standalone clones need an in-process scheduler. Set this to 0 when a
      # host scheduler is configured and owns every paper-trading slot.
      ASTOCK_ENABLE_FALLBACK_THREADS: "${ASTOCK_ENABLE_FALLBACK_THREADS:-1}"
    volumes:
      # data_fetcher.py stores SQLite, universe and market caches here.
      # Deliberately use a release-scoped volume name so a clone does not
      # accidentally attach an older private simulation/evolution ledger.
      - astock_repo_data:/app/backend/data_cache
      # Daily reports and logs are written below the repository root.
      - astock_repo_reports:/app/reports
    init: true

volumes:
  astock_repo_data:
  astock_repo_reports:
