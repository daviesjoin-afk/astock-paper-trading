name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-patch:
    if: github.event.pull_request.head.ref == 'codex/issue-25-replay-traceability'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply exact replay-date source patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_or_verify(path, old, new, expected=1):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              old_count = text.count(old)
              new_count = text.count(new)
              if old_count == expected:
                  p.write_text(text.replace(old, new), encoding='utf-8')
                  return
              if old_count == 0 and new_count == expected:
                  return
              raise SystemExit(
                  f'{path}: expected {expected} old or new exact matches; '
                  f'got old={old_count}, new={new_count}'
              )

          replace_or_verify(
              'backend/strategies.py',
              '''def run_strategy(\n    strategy_id,\n    table: pd.DataFrame,\n    topn=10,\n    news_hits=None,\n    gate=None,\n    auto_news=True,\n    klines=None,\n    first_board_codes=None,\n    weight_overrides=None,\n    condition_overrides=None,\n):''',
              '''def run_strategy(\n    strategy_id,\n    table: pd.DataFrame,\n    topn=10,\n    news_hits=None,\n    gate=None,\n    auto_news=True,\n    klines=None,\n    first_board_codes=None,\n    weight_overrides=None,\n    condition_overrides=None,\n    replay_data_date=None,\n    replay_required=False,\n):''',
              expected=2,
          )
          replace_or_verify(
              'backend/strategies.py',
              '''            weight_overrides=weight_overrides,\n            condition_overrides=condition_overrides,\n        )\n    return _run_strategy_legacy(''',
              '''            weight_overrides=weight_overrides,\n            condition_overrides=condition_overrides,\n            replay_data_date=replay_data_date,\n            replay_required=replay_required,\n        )\n    return _run_strategy_legacy(''',
          )
          replace_or_verify(
              'backend/main.py',
              '''        gate=gate,\n        first_board_codes=first_board_codes,\n    )''',
              '''        gate=gate,\n        first_board_codes=first_board_codes,\n        replay_data_date=complete_cutoff,\n        replay_required=True,\n    )''',
          )
          replace_or_verify(
              'backend/paper_trading.py',
              '''                             gate={"light": market["light"]}, first_board_codes=first_board_codes,\n                             weight_overrides=selection_overlay.get("weights"),\n                             condition_overrides=selection_overlay.get("conditions"))''',
              '''                             gate={"light": market["light"]}, first_board_codes=first_board_codes,\n                             weight_overrides=selection_overlay.get("weights"),\n                             condition_overrides=selection_overlay.get("conditions"),\n                             replay_data_date=asof_date, replay_required=True)''',
              expected=2,
          )
          PY
          git diff --check
          if git diff --quiet -- backend/strategies.py backend/main.py backend/paper_trading.py; then
            echo 'Source patch already present.'
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add backend/strategies.py backend/main.py backend/paper_trading.py
          git commit -m 'fix(strategy): wire explicit replay dates [source-patch]'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.lock
      - name: Run backend unit tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s backend -p "test_*.py" -v

  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile backend modules
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m compileall -q backend
      - name: Check frontend source syntax
        # PR-55：源已拆到 frontend/src/**（ESM），逐个模块做语法检查。
        run: find frontend/src -name '*.js' -print0 | xargs -0 -n1 node --check

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install build tools
        working-directory: frontend
        run: npm ci
      - name: Build frontend bundle
        working-directory: frontend
        run: npm run build
      - name: Run frontend unit tests
        # PR-2：操作员凭据的行为契约（GET 绝不带 Authorization、写方法带 Bearer、
        # 凭据只存 sessionStorage）。这是**行为**断言，Python 侧的源码存在性
        # 检查无法覆盖（负向验证 N4 证实）。
        #
        # 注意：`node --test` 在 Node 20 上**不接受 glob 模式**（会把
        # "tests/**/*.test.mjs" 当字面路径，报 Could not find）。因此这里依赖
        # shell 展开——脚本里写的是未加引号的 tests/*.test.mjs。
        working-directory: frontend
        run: npm run test:unit
      - name: Verify committed dist is up to date
        run: git diff --exit-code -- frontend/dist

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install pinned quality tools
        run: python -m pip install ruff==0.16.6 pip-audit==2.10.1 uv==0.12.5
      - name: Verify dependency lock
        shell: bash
        run: |
          cp requirements.lock /tmp/requirements.lock
          uv pip compile requirements.txt --universal --python-version 3.11 \
            --no-emit-index-url --custom-compile-command "uv pip compile requirements.txt" \
            --output-file /tmp/requirements.lock
          cmp --silent requirements.lock /tmp/requirements.lock
      - name: Lint backend
        run: ruff check backend
      - name: Audit locked dependencies
        run: pip-audit --requirement requirements.lock --strict --progress-spinner off

  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Build application image
        run: docker build --tag astock-codex:ci .
      # Issue #29: the offline test suite must pass with *no network at all*,
      # so core tests stay deterministic and cannot silently grow external
      # calls.  New network-optional tests must skip unless explicitly
      # enabled (see CONTRIBUTING.md "测试分层").
      - name: Run backend tests with network disabled
        run: >
          docker run --rm --network none
          --tmpfs /app/data_cache:rw,size=64m,uid=10001,gid=10001
          astock-codex:ci python -m unittest discover -s backend -p "test_*.py"
      - name: Start isolated paper-only container
        run: |
          docker run --detach --name astock-ci \
            --env ASTOCK_ENABLE_FALLBACK_THREADS=0 \
            --tmpfs /app/data_cache:rw,size=64m,uid=10001,gid=10001 \
            --publish 127.0.0.1:18600:8600 \
            astock-codex:ci
      - name: Verify health endpoints
        shell: bash
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:18600/api/health >/dev/null \
              && curl --fail --silent --show-error http://127.0.0.1:18600/api/adaptive/ai/settings >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker logs astock-ci
          exit 1
      - name: Show logs and clean up
        if: always()
        shell: bash
        run: |
          docker logs astock-ci || true
          docker rm --force astock-ci || true

  # PR-56：真实浏览器 E2E（Playwright + Chromium，单 job，避免每个 Python 矩阵都装浏览器）。
  # 用项目 venv 的 Python 起真实 FastAPI（临时 ASTOCK_DATA_DIR + ASTOCK_DEMO=1），
  # 浏览器只访问本机 HTTP，不依赖行情 / LLM / 新闻等外部服务。
  browser-e2e:
    name: browser-e2e (chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.lock
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend build + test tooling
        working-directory: frontend
        run: npm ci
      - name: Rebuild frontend bundle and fail if committed dist is stale
        working-directory: frontend
        run: |
          npm run build
          git diff --exit-code -- dist
      - name: Install Chromium only
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run browser journeys against a real local server
        working-directory: frontend
        env:
          # 用 setup-python 的解释器起后端；临时数据目录由 server.py 自己创建
          ASTOCK_E2E_PYTHON: python
          ASTOCK_E2E_PORT: "8611"
        run: npx playwright test --project=chromium
      - name: Upload failure artifacts (screenshots / traces / video)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-e2e-artifacts
          path: |
            frontend/e2e/.artifacts
            frontend/playwright-report
          retention-days: 7
          if-no-files-found: ignore
