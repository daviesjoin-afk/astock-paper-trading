name: PR6 Slot Extract

on:
  push:
    branches: [codex/p1-architecture-strangler-ii]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/p1-architecture-strangler-ii
      - name: Apply exact facade extraction
        run: python tools/pr6_slot_extract.py
      - name: Commit extraction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/paper_trading.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "refactor(paper): delegate slot preflight from facade"
          git push origin HEAD:codex/p1-architecture-strangler-ii
