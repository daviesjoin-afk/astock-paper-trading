name: v2-independent-kernel

# V2 is the only application in this repository, so these checks are required
# on every pull request and every master push. Do not re-add a `paths:` filter:
# a retirement or repository-level change must not skip the kernel suite.
on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  rust-kernel:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
      - name: Record Rust toolchain
        run: rustc --version && cargo --version
      - name: Rust tests
        run: cargo test --locked --all-targets --verbose
      - name: Rust release build
        run: cargo build --release --locked

  data-sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m unittest discover -s v2/research -p 'test_*.py' -v
      - run: python -m unittest discover -s v2/data_sources -p 'test_*.py' -v
      - name: Verify a complete price set builds from fixture rows
        run: |
          python v2/research/make_price_set.py \
            --input v2/data/price-set-examples/sample-prices.csv \
            --out /tmp/v2-price-set.json \
            --set-id ci-example \
            --pack ci-pack \
            --trust synthetic \
            --coverage-start 2026-10-30 \
            --coverage-end 2026-11-03 \
            --symbols 600000.SH \
            --days 2026-10-30,2026-11-02,2026-11-03
      - name: Verify database backup tooling
        run: |
          python - <<'PY'
          import sqlite3, subprocess, sys, tempfile
          from pathlib import Path

          with tempfile.TemporaryDirectory() as temp:
              root = Path(temp)
              db = root / "v2.sqlite3"
              backup = root / "backup.sqlite3"
              connection = sqlite3.connect(db)
              connection.executescript(
                  """
                  CREATE TABLE schema_version(version INTEGER NOT NULL);
                  INSERT INTO schema_version VALUES(2);
                  CREATE TABLE account(account_id TEXT PRIMARY KEY);
                  CREATE TABLE day_run(account_id TEXT, day TEXT);
                  """
              )
              connection.commit()
              connection.close()
              for args in (
                  ["backup", "--db", str(db), "--out", str(backup)],
                  ["verify", "--db", str(backup)],
              ):
                  subprocess.run(
                      [sys.executable, "v2/scripts/db_tool.py", *args],
                      check=True,
                  )
          PY

  web-e2e:
    runs-on: ubuntu-latest
    needs: [rust-kernel, data-sources]
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
      - name: Build the kernel the browser tests drive
        run: cargo build --release --locked
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install web dependencies and the pinned Chromium
        working-directory: v2/web
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Build the read-only dashboard served by the preview server
        working-directory: v2/web
        run: npm run build
      - name: Browser interaction, race, failure and safety tests
        working-directory: v2/web
        env:
          ASTOCK_V2_BIN: ${{ github.workspace }}/v2/target/release/astock-v2
        run: npx playwright test
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: v2-web-e2e-report
          path: v2/web/playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  web-ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
      - run: npm run build
