name: v2-independent-kernel

on:
  pull_request:
    paths:
      - "v2/**"
      - ".github/workflows/v2.yml"
  push:
    # Temporary validation branch: no sixth stacked PR before manual integration.
    branches: [master, codex/v2-pit-state]
    paths:
      - "v2/**"
      - ".github/workflows/v2.yml"

permissions:
  contents: read

jobs:
  rust-kernel:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
      - name: Record Rust toolchain
        run: rustc --version && cargo --version
      - name: Rust tests
        run: cargo test --locked --all-targets --verbose
      - name: Rust release build
        run: cargo build --release --locked

  research-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m unittest discover -s v2/research -p 'test_*.py' -v
      - run: python v2/research/worker.py --output /tmp/v2-fixture.json

  web-ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
      - run: npm run build

  integration-smoke:
    runs-on: ubuntu-latest
    needs: [rust-kernel, research-contract]
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Full Rust API + Python signal + replay smoke
        run: bash scripts/smoke.sh
