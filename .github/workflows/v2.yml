name: v2-independent-kernel

# V2 is the only application in this repository, so these checks are required
# on every pull request and every push to a branch that can be deployed or
# published. Do not re-add a `paths:` filter: a retirement or repository-level
# change must not skip the kernel suite.
# `release/**` is pushed directly (the snapshot branch is not merged through a
# PR), so listing only `master` let exactly those pushes ship untested.
on:
  pull_request:
  push:
    branches:
      - master
      - "release/**"

permissions:
  contents: read

jobs:
  rust-kernel:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
      - name: Record Rust toolchain
        run: rustc --version && cargo --version
      - name: Rust tests
        run: cargo test --locked --all-targets --verbose
      - name: Rust release build
        run: cargo build --release --locked
      - name: Verify price-set publication from fixture rows
        run: |
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT
          args=(--input data/price-set-examples/sample-prices.csv
            --set-id ci-example --pack ci-pack --trust synthetic
            --coverage-start 2026-10-30 --coverage-end 2026-11-03
            --symbols 600000.SH --out "$work/catalog")
          days=2026-10-30,2026-11-02,2026-11-03
          bash scripts/publish_price_set.sh "${args[@]}" --days "$days" --dry-run
          test ! -e "$work/catalog"
          status=0
          bash scripts/publish_price_set.sh "${args[@]}" --days "$days,2026-11-04" || status=$?
          test "$status" -eq 3
          test ! -e "$work/catalog"
          summary=$(bash scripts/publish_price_set.sh "${args[@]}" --days "$days")
          echo "$summary"
          grep -Fx 'published set=ci-example trust=synthetic entries=3 source_digest=1a2ca8ef81169150a331fa1a805cd3af2c5c6938a6e69d7c6c14c5e97fa2c5bc' <<< "$summary"
          test -s "$work/catalog/ci-example.json"
          status=0
          bash scripts/publish_price_set.sh "${args[@]}" --days "$days" || status=$?
          test "$status" -eq 3
          bash scripts/publish_price_set.sh "${args[@]}" --days "$days" --force
      - name: Verify database backup tooling
        run: |
          python3 - <<'PY'
          import sqlite3, subprocess, tempfile
          from pathlib import Path

          with tempfile.TemporaryDirectory() as temp:
              root = Path(temp)
              db = root / "v2.sqlite3"
              backup = root / "backup.sqlite3"
              restored = root / "restored.sqlite3"
              connection = sqlite3.connect(db)
              connection.executescript(
                  """
                  CREATE TABLE schema_version(version INTEGER NOT NULL);
                  INSERT INTO schema_version VALUES(2);
                  CREATE TABLE account(account_id TEXT PRIMARY KEY);
                  CREATE TABLE day_run(account_id TEXT, day TEXT);
                  """
              )
              connection.commit()
              connection.close()
              for args in (
                  ["backup", "--db", str(db), "--out", str(backup)],
                  ["verify", "--db", str(backup)],
                  ["restore", "--backup", str(backup), "--db", str(restored)],
                  ["verify", "--db", str(restored)],
              ):
                  subprocess.run(
                      ["target/release/astock-v2", "db", *args],
                      check=True,
                  )
          PY

  data-sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m unittest discover -s v2/research -p 'test_*.py' -v
      - run: python -m unittest discover -s v2/data_sources -p 'test_*.py' -v
      # The research tooling under v2/scripts is what every measurement in the
      # optimization loop runs through: fold generation, factor scans, power
      # checks and the evolution-cycle gate. Those tests existed and passed but
      # were never executed by CI, so a change could break the measurement
      # apparatus while the kernel stayed green.
      - name: Research tooling tests
        run: python -m unittest discover -s v2/scripts -p 'test_*.py' -v

  web-e2e:
    runs-on: ubuntu-latest
    needs: [rust-kernel, data-sources]
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
      - name: Build the kernel the browser tests drive
        run: cargo build --release --locked
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install web dependencies and the pinned Chromium
        working-directory: v2/web
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Build the read-only dashboard served by the preview server
        working-directory: v2/web
        run: npm run build
      - name: Browser interaction, race, failure and safety tests
        working-directory: v2/web
        env:
          ASTOCK_V2_BIN: ${{ github.workspace }}/v2/target/release/astock-v2
        run: npx playwright test
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: v2-web-e2e-report
          path: v2/web/playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  web-ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
      - run: npm run build
