name: v2-independent-kernel

# V2 is the only application in this repository, so these checks are required
# on every pull request and every master push. Do not re-add a `paths:` filter:
# a retirement or repository-level change must not skip the kernel suite.
on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  rust-kernel:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
      - name: Record Rust toolchain
        run: rustc --version && cargo --version
      - name: Rust tests
        run: cargo test --locked --all-targets --verbose
      - name: Rust release build
        run: cargo build --release --locked
      - name: Measure the real offline Store path (no performance threshold)
        run: |
          mkdir -p benchmark-results
          { rustc --version; cargo --version; uname -a; lscpu; df -T .; } > benchmark-results/environment.txt
          cargo run --release --locked --example ledger_bench -- 100 1000 5000 > benchmark-results/ledger.json
      - uses: actions/upload-artifact@v4
        with:
          name: v2-ledger-benchmark-${{ github.sha }}
          path: v2/benchmark-results/

  research-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m unittest discover -s v2/research -p 'test_*.py' -v
      - run: python v2/research/worker.py --output /tmp/v2-fixture.json

  web-e2e:
    runs-on: ubuntu-latest
    needs: [rust-kernel, research-contract]
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
      - name: Build the kernel the browser tests drive
        run: cargo build --release --locked
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install web dependencies and the pinned Chromium
        working-directory: v2/web
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Build the read-only dashboard served by the preview server
        working-directory: v2/web
        run: npm run build
      - name: Browser interaction, race, failure and safety tests
        working-directory: v2/web
        env:
          ASTOCK_V2_BIN: ${{ github.workspace }}/v2/target/release/astock-v2
        run: npx playwright test
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: v2-web-e2e-report
          path: v2/web/playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  web-ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
      - run: npm run build

  integration-smoke:
    runs-on: ubuntu-latest
    needs: [rust-kernel, research-contract]
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Full Rust API + Python signal + replay smoke
        run: bash scripts/smoke.sh

  verify-report:
    runs-on: ubuntu-latest
    needs: [rust-kernel, research-contract, integration-smoke]
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Verification report (research + smoke)
        env:
          CARGO: cargo
          RUSTUP_TOOLCHAIN: "1.99.1"
        run: |
          mkdir -p artifacts
          bash scripts/verify_all.sh --only research,smoke,security-scan --report artifacts/verify.json
      - name: Archive pair scenario
        run: |
          mkdir -p artifacts/archive-dir
          python - <<'PY_PAIR'
          import json, sqlite3, sys
          from pathlib import Path
          sys.path.insert(0, "scripts")
          import verify_export

          root = Path("artifacts/archive-dir")
          db = root / "pair.sqlite3"
          connection = sqlite3.connect(db)
          connection.execute("CREATE TABLE v2_paper_accounts (account_id TEXT PRIMARY KEY)")
          connection.execute("CREATE TABLE v2_evolution_events (event_id TEXT PRIMARY KEY)")
          connection.execute("PRAGMA user_version = 15")
          connection.commit()
          connection.close()

          document = {
              "schema_version": 1, "candidate_id": None, "status": None,
              "from_day": None, "to_day": None, "count": 0, "events": [],
          }
          document["digest"] = verify_export.canonical_digest(document)
          (root / "pair.export.json").write_text(json.dumps(document), encoding="utf-8")
          PY_PAIR
          python scripts/verify_archive.py --dir artifacts/archive-dir             --manifest-out artifacts/archive-manifest.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v2-verify-report
          path: v2/artifacts
          if-no-files-found: warn
