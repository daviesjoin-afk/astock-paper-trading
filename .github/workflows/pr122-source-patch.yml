name: PR122 exact replay-date source patch

on:
  push:
    branches:
      - codex/issue-25-replay-traceability

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'fix(strategy): wire explicit replay dates [source-patch]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-25-replay-traceability
          fetch-depth: 0
      - name: Patch exact production call sites
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new, expected=1):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected} exact matches, got {count}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          replace_exact(
              'backend/strategies.py',
              '''def run_strategy(\n    strategy_id,\n    table: pd.DataFrame,\n    topn=10,\n    news_hits=None,\n    gate=None,\n    auto_news=True,\n    klines=None,\n    first_board_codes=None,\n    weight_overrides=None,\n    condition_overrides=None,\n):''',
              '''def run_strategy(\n    strategy_id,\n    table: pd.DataFrame,\n    topn=10,\n    news_hits=None,\n    gate=None,\n    auto_news=True,\n    klines=None,\n    first_board_codes=None,\n    weight_overrides=None,\n    condition_overrides=None,\n    replay_data_date=None,\n    replay_required=False,\n):''',
          )
          replace_exact(
              'backend/strategies.py',
              '''            weight_overrides=weight_overrides,\n            condition_overrides=condition_overrides,\n        )\n    return _run_strategy_legacy(''',
              '''            weight_overrides=weight_overrides,\n            condition_overrides=condition_overrides,\n            replay_data_date=replay_data_date,\n            replay_required=replay_required,\n        )\n    return _run_strategy_legacy(''',
          )

          public_old = '''        gate=gate,\n        first_board_codes=first_board_codes,\n    )'''
          public_new = '''        gate=gate,\n        first_board_codes=first_board_codes,\n        replay_data_date=complete_cutoff,\n        replay_required=True,\n    )'''
          replace_exact('backend/main.py', public_old, public_new)

          paper_old = '''                             gate={"light": market["light"]}, first_board_codes=first_board_codes,\n                             weight_overrides=selection_overlay.get("weights"),\n                             condition_overrides=selection_overlay.get("conditions"))'''
          paper_new = '''                             gate={"light": market["light"]}, first_board_codes=first_board_codes,\n                             weight_overrides=selection_overlay.get("weights"),\n                             condition_overrides=selection_overlay.get("conditions"),\n                             replay_data_date=asof_date, replay_required=True)'''
          replace_exact('backend/paper_trading.py', paper_old, paper_new, expected=2)
          PY
      - name: Commit source patch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add backend/strategies.py backend/main.py backend/paper_trading.py
          git diff --cached --check
          git commit -m 'fix(strategy): wire explicit replay dates [source-patch]'
          git push origin HEAD:codex/issue-25-replay-traceability
