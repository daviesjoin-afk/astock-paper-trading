name: PR6 Preflight Ordering Fix

on:
  push:
    branches: [codex/p1-architecture-strangler-ii]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/p1-architecture-strangler-ii
      - run: python tools/pr6_order_fix.py
      - name: Commit ordering fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/paper_trading.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix(paper): preserve preflight exceptional ordering"
          git push origin HEAD:codex/p1-architecture-strangler-ii
