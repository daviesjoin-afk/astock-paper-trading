# OpenCodeReview —— 第四层「语义评审」观察层（Layer 3 semantic review）。
#
# 这一层是**补充**，不是替代品，也不构成正确性证明：
#   Layer 1 deterministic : ruff / compileall / unittest / security scan / docker-smoke
#   Layer 2 behavioral    : targeted regression / mutation / full backend suite
#   Layer 3 semantic      : OpenCodeReview（跨文件语义、owner/authority、PIT/provenance）
#   Layer 4 human         : authority / provenance / architecture / roadmap
# OCR 不替代 unittest、mutation、ruff、security scan、exact-head CI 或人工审核；
# OCR 没发现问题 != 正确性已被证明。
#
# 观察模式（observation mode）：本 job 会运行、会发评论、会发 sticky summary，
# 操作故障时会 RED；但它**不是** master branch protection 的 required check。
# 先收集 5–10 个真实 PR 的真阳性 / 假阳性 / 噪声 / token 用量，再决定是否升级为门禁。
# 因此这里**刻意不写** `continue-on-error: true`：OCR provider / auth / action 自己坏掉时，
# 我们需要看到 job RED，而不是假绿。「不阻塞 merge」由 branch protection 不把它列为
# required context 实现，而不是靠吞掉失败。
#
# 安全模型：
#   * 事件是 pull_request_target —— base 分支上的 workflow 定义被使用，因此 secrets 可用，
#     且运行的是 **trusted base** 版本的本文件，PR 无法改写它。
#   * 本 wrapper **不做任何 checkout**，尤其不用
#     `actions/checkout` + `ref: ${{ github.event.pull_request.head.sha }}`。
#     pinned v1.12.9 的 action 自己 checkout trusted base，只用 `git fetch` 拉取 PR head 的
#     git objects 来算 base→head diff，不把 untrusted PR head 落成工作目录、也不执行 PR 代码。
#   * 权限最小化：contents: read + pull-requests: write。
#     本轮 resolve_outdated = false，所以不需要 contents: write。
#   * 密钥只通过 secrets / vars 注入，本文件不含任何字面量凭据；也不回显它们。
#
# 依赖固定（双重 pin，两者都必须一起升级）：action 实现 = full commit SHA，
# 安装的 CLI = 1.12.9。禁止 `@main` 与 `ocr_version: latest`。

name: OpenCodeReview PR Review

on:
  # 第一阶段只接 pull_request_target 的三个事件。
  # 刻意不接 issue_comment / workflow_run / push / schedule：先把攻击面与复杂度降到最低。
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ocr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  semantic-review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Run OpenCodeReview
        # v1.12.9 release commit（bccbc15f785269400735d5255540c231e6c02b6d）。
        # 必须固定到 full commit SHA：tag 可变，不能作为永久依赖。
        uses: alibaba/open-code-review@bccbc15f785269400735d5255540c231e6c02b6d # v1.12.9
        with:
          # 凭据只从仓库配置注入；这里不提供默认值，也不回显。
          llm_url: ${{ secrets.OCR_LLM_URL }}
          llm_auth_token: ${{ secrets.OCR_LLM_AUTH_TOKEN }}
          llm_model: ${{ vars.OCR_LLM_MODEL }}
          # 注意 v1.12.9 的语义：**显式空串、true、1、yes 都选中 Anthropic 协议**，
          # 其余值选中 OpenAI-compatible 协议。也就是说该 variable 未配置时（解析成空串）
          # 会被当成 Anthropic。所以人工配置时必须显式写 false 或 true，不要留空。
          # 不要按模型名猜协议。
          llm_use_anthropic: ${{ vars.OCR_LLM_USE_ANTHROPIC }}

          # CLI 版本固定；与上面的 action SHA 一起构成双重 pin。
          ocr_version: "1.12.9"
          language: "Chinese"

          # 项目级规则：backend owner/authority/PIT/provenance、contract/mutation 测试、
          # GitHub workflow runtime/security。
          rule: ".opencodereview/rule.json"

          effort: "high"
          review_concurrency: "4"
          max_tokens_budget: "300000"

          sticky_summary: "true"
          incremental: "true"
          # 第一阶段不让 OCR 自动改已有 review thread 状态（因而不需要 contents: write）。
          resolve_outdated: "false"

          # 低价值类别沉到 summary，减少 inline 噪声。
          route_severity_below: "low"
          route_categories: "style,documentation"

          # 原始 JSON 结果与 stderr 作为 artifact 留档，便于事后统计真/假阳性与 token 截断。
          # 必须是字面字符串 'true'（action 内部用字符串比较）。
          upload_artifacts: "true"
          stream_progress: "false"

          background: >-
            Review this A-share paper-trading repository for concrete
            correctness, security, provenance, point-in-time, authority,
            maintainability and regression defects introduced by this PR.
