name: PR5 Group Cap Apply

on:
  push:
    branches: [codex/p1-factor-calibration-v2]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/p1-factor-calibration-v2
          fetch-depth: 0
      - name: Apply exact group-cap patch
        run: |
          python tools/pr5_group_cap_apply.py
          python -m py_compile backend/strategies.py backend/factor_calibration.py
          git diff --check
      - name: Commit generated patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/strategies.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix(factors): cap correlated runtime weight groups'
          git push origin HEAD:codex/p1-factor-calibration-v2
