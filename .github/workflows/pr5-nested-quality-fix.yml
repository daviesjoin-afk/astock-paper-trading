name: PR5 Nested Quality Fix

on:
  push:
    branches: [codex/p1-factor-calibration-v2]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/p1-factor-calibration-v2
      - name: Apply nested quality patch
        run: python tools/pr5_nested_quality_fix.py
      - name: Commit generated patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/strategies.py backend/test_factor_calibration_v2.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix(factors): preserve nested composite evidence coverage"
          git push origin HEAD:codex/p1-factor-calibration-v2
