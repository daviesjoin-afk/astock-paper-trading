limit_req_zone $binary_remote_addr zone=astock_codex_api:10m rate=20r/s;

server {
    listen 8600;
    listen [::]:8600;
    server_name _;

    charset utf-8;
    client_max_body_size 1m;

    gzip on;
    gzip_comp_level 7;
    gzip_min_length 256;
    gzip_vary on;
    gzip_types application/json application/javascript text/css text/plain application/xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy no-referrer always;

    # 静态资源长缓存（前端通过 ?v= 参数控制版本刷新）
    location /assets/ {
        proxy_pass http://127.0.0.1:18600;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location / {
        limit_req zone=astock_codex_api burst=30 nodelay;
        proxy_pass http://127.0.0.1:18600;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_buffering on;
        proxy_buffers 16 16k;
        proxy_busy_buffers_size 32k;
    }
}