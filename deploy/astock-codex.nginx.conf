limit_req_zone $binary_remote_addr zone=astock_codex_api:10m rate=20r/s;

# PR-2 复审 Blocker 1：转发 Host 时必须**保留原始 host:port**。
#
# `$host` 会被 nginx 规范化并丢掉非默认端口：浏览器访问 http://server.example.com:8600 时
# 发送 `Origin: http://server.example.com:8600`，而 `$host` 只给出 `server`，后端按 http
# 默认端口 80 与 origin 的 8600 比较 → 判定跨源 → 合法同源写请求被 403。
# `$http_host` 保留客户端原样发送的 host:port（后端负责校验其合法性：
# local-only 模式要求 Host 为 localhost/loopback 字面量，authenticated 模式
# 要求 Origin 与 Host 同源）。
# 仅当客户端未发送 Host（HTTP/1.0）时回退到 `$host`，避免向上游转发空 Host。
map $http_host $astock_upstream_host {
    ""      $host;
    default $http_host;
}

server {
    listen 8600;
    listen [::]:8600;
    server_name _;

    charset utf-8;
    client_max_body_size 1m;

    gzip on;
    gzip_comp_level 7;
    gzip_min_length 256;
    gzip_vary on;
    gzip_types application/json application/javascript text/css text/plain application/xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy no-referrer always;

    # 静态资源长缓存（前端通过 ?v= 参数控制版本刷新）
    location /assets/ {
        proxy_pass http://127.0.0.1:18600;
        proxy_http_version 1.1;
        proxy_set_header Host $astock_upstream_host;
        expires 7d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location / {
        limit_req zone=astock_codex_api burst=30 nodelay;
        proxy_pass http://127.0.0.1:18600;
        proxy_http_version 1.1;
        proxy_set_header Host $astock_upstream_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_buffering on;
        proxy_buffers 16 16k;
        proxy_busy_buffers_size 32k;
    }
}