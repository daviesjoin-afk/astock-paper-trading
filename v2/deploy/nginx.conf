# Static console + API reverse proxy for the rebuilt V2. Port 8600 is the
# stable public entry point; the old service must be stopped before this file
# is enabled so nginx never has two competing 8600 listeners.
limit_req_zone $binary_remote_addr zone=astock_v2_rewrite_api:10m rate=20r/s;

server {
    listen 8600;
    listen [::]:8600;
    server_name _;

    root /opt/astock-v2-rewrite/web;
    index index.html;
    charset utf-8;
    client_max_body_size 1m;

    gzip on;
    gzip_comp_level 7;
    gzip_min_length 256;
    gzip_vary on;
    gzip_types application/json application/javascript text/css text/plain application/xml;

    location /v2/ {
        limit_req zone=astock_v2_rewrite_api burst=30 nodelay;
        proxy_pass http://127.0.0.1:18765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
}
