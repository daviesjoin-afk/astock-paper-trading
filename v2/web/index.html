<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="AStock V2 模拟盘：盘中实时视图、行情与研究。" />
    <meta name="theme-color" content="#f4f6fa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b1017" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232563eb'/%3E%3Cpath d='M8 21.5 13.2 15l4.1 3.6L24 10.5' fill='none' stroke='white' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <title>AStock V2 · 稳健与激进</title>
  </head>
  <body>
    <a class="skip-link" href="#main">跳到主要内容</a>
    <div id="live" class="sr-only" role="status" aria-live="polite" aria-atomic="true" data-testid="live-status"></div>

    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 16.5 9.2 10l4.1 3.6L20 5.5" />
              <path d="M15.4 5.5H20v4.6" />
            </svg>
          </span>
          <div>
            <h1>AStock<span class="brand-version">V2</span></h1>
            <p class="brand-sub">盘中模拟 · 行情 · 研究</p>
          </div>
        </div>
        <div class="top-actions">
          <button type="button" class="btn btn-quiet" data-testid="refresh" id="refresh">刷新</button>
          <button type="button" class="btn btn-quiet" data-testid="report-copy" id="report-copy">复制复盘</button>
          <button type="button" class="btn btn-quiet" data-testid="theme-toggle" id="theme-toggle"
                  aria-pressed="false" aria-label="切换深色模式">深色</button>
        </div>
      </div>
    </header>

    <nav class="module-nav" aria-label="主功能导航">
      <div class="module-nav-inner" id="module-nav"></div>
    </nav>

    <main id="main" tabindex="-1" aria-busy="false">
      <nav class="view-nav" aria-label="二级导航" id="view-nav" role="tablist" hidden></nav>

      <div id="live-module" class="view" hidden></div>

      <div id="view-market-screener" class="view" data-view="market/screener" hidden>
        <section class="panel">
          <div class="panel-head">
            <div><h2>全市场</h2><p class="muted">已入库的全部标的，按当日涨跌幅排序。</p></div>
            <span class="count" id="screener-count">—</span>
          </div>
          <div class="toolbar">
            <label class="field-inline"><span>交易日</span><select id="screener-day"></select></label>
            <label class="field-inline"><span>筛选</span><input id="screener-filter" type="search" placeholder="代码或名称" /></label>
          </div>
          <div class="table-scroll table-tall">
            <table>
              <thead><tr><th>代码</th><th>名称</th><th class="num-col">收盘</th><th class="num-col">涨跌</th><th class="num-col">成交量</th></tr></thead>
              <tbody id="screener-body"></tbody>
            </table>
          </div>
          <p class="empty" id="screener-empty">还没有行情数据。先运行数据摄取。</p>
        </section>
      </div>

      <div id="view-market-detail" class="view" data-view="market/detail" hidden>
        <section class="panel">
          <div class="panel-head">
            <div><h2>个股详情</h2><p class="muted">收盘价来自已入库的不复权行情；除权除息日的缺口单独标注。</p></div>
            <span class="count" id="detail-symbol" data-testid="detail-symbol">—</span>
          </div>
          <div class="toolbar">
            <label class="field-inline"><span>代码</span><input id="detail-input" type="search" placeholder="600000.SH" /></label>
            <button type="button" id="detail-load">查看</button>
          </div>
          <dl class="metrics" id="detail-metrics">
            <div><dt>最新收盘</dt><dd id="detail-close" data-testid="detail-close">—</dd></div>
            <div><dt>区间涨跌</dt><dd id="detail-change" data-testid="detail-change">—</dd></div>
            <div><dt>最高 / 最低</dt><dd id="detail-range" data-testid="detail-range">—</dd></div>
            <div><dt>交易日数</dt><dd id="detail-days" data-testid="detail-days">—</dd></div>
          </dl>
          <div id="detail-chart" data-testid="detail-chart"></div>
          <p class="empty" id="detail-empty" data-testid="detail-empty">输入代码查看个股走势。</p>
        </section>
      </div>

      <div id="view-research-candidates" class="view" data-view="research/candidates" hidden>
        <section class="panel">
          <div class="panel-head">
            <h2>候选因子评审</h2>
            <p class="muted">只读：这里显示门禁的判断，不改变任何状态。晋升要跑
              <code>promote_candidate.py --apply</code>。</p>
          </div>
          <p class="muted" data-testid="research-empty" id="research-empty" hidden>
            还没有影子候选。先跑 <code>shadow_advance.sh</code> 让候选进影子。
          </p>
          <table class="table" data-testid="research-table" id="research-table" hidden>
            <thead>
              <tr><th>候选</th><th>算法</th><th>状态</th><th>影子天数</th><th>门禁</th></tr>
            </thead>
            <tbody id="research-rows" data-testid="research-rows"></tbody>
          </table>
        </section>
      </div>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
