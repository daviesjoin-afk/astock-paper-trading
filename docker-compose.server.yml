services:
  astock:
    build:
      context: .
      dockerfile: Dockerfile
    image: astock-codex:latest
    container_name: astock-codex
    restart: on-failure:5
    ports:
      - "127.0.0.1:18600:8600"
    env_file:
      - /root/.config/astock-codex/deepseek.env
    environment:
      ASTOCK_SCHEDULE_FILE: /app/deploy/astock-codex.cron
      # 主力股点火通道：仅在 +3.5%~+7.5% 区间内，经八项证据和快速
      # 确认后才允许进入既有的三分钟审批链路；不是绕开风控的追涨开关。
      PAPER_IGNITION_BUY: "1"
      # Production scheduling is owned by the host cron file.  Keep the
      # in-container fallback loop explicitly disabled so an env-file change
      # cannot create duplicate 3-minute scans.
      ASTOCK_ENABLE_FALLBACK_THREADS: "0"
    volumes:
      - ./data_cache:/app/data_cache
      - ./reports:/app/reports
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    # Keep the trading UI/risk API alive even when a data worker is paused or
    # OOM-killed.  Heavy scans run in the separate astock-data-worker cgroup.
    mem_limit: 950m
    memswap_limit: 1250m
    mem_reservation: 640m
    cpus: 1.0
    pids_limit: 128
    security_opt:
      - no-new-privileges:true

  astock-data-worker:
    image: astock-codex:latest
    container_name: astock-data-worker
    restart: unless-stopped
    command: ["sleep", "infinity"]
    env_file:
      - /root/.config/astock-codex/deepseek.env
    environment:
      ASTOCK_CACHE_DIR: /app/data_cache
      ASTOCK_WORKER_HIGH_WATER_PCT: "88"
    volumes:
      - ./data_cache:/app/data_cache
      - ./reports:/app/reports
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    mem_limit: 650m
    memswap_limit: 850m
    mem_reservation: 192m
    cpus: 0.6
    pids_limit: 96
    healthcheck:
      disable: true
    security_opt:
      - no-new-privileges:true

  # Short-lived paper/news/adaptive runners have their own cgroup.  The API
  # process keeps its 950MB budget for requests and risk reads, while the
  # host cron invokes these one-shot jobs here instead of fork/exec'ing a full
  # Python application inside astock-codex.
  astock-task-worker:
    image: astock-codex:latest
    container_name: astock-task-worker
    restart: unless-stopped
    command: ["python", "-u", "backend/adaptive_learning_worker.py"]
    env_file:
      - /root/.config/astock-codex/deepseek.env
    environment:
      ASTOCK_CACHE_DIR: /app/data_cache
      ASTOCK_WORKER_HIGH_WATER_PCT: "84"
    volumes:
      - ./data_cache:/app/data_cache
      - ./reports:/app/reports
    read_only: true
    tmpfs:
      - /tmp:size=48m,mode=1777
    mem_limit: 720m
    memswap_limit: 900m
    mem_reservation: 160m
    cpus: 0.6
    pids_limit: 96
    healthcheck:
      disable: true
    security_opt:
      - no-new-privileges:true

  # Paper scans import the complete trading and risk stack.  Keep them apart
  # from the long-lived adaptive-learning queue so one cannot OOM/restart the
  # other and leave the intraday audit trail stale.
  astock-paper-worker:
    image: astock-codex:latest
    container_name: astock-paper-worker
    restart: unless-stopped
    command: ["sleep", "infinity"]
    env_file:
      - /root/.config/astock-codex/deepseek.env
    environment:
      ASTOCK_CACHE_DIR: /app/data_cache
      ASTOCK_WORKER_HIGH_WATER_PCT: "84"
      # Host cron invokes paper_runner in this container, so it must share the
      # API container's explicit point-of-ignition setting.
      PAPER_IGNITION_BUY: "1"
    volumes:
      - ./data_cache:/app/data_cache
      - ./reports:/app/reports
    read_only: true
    tmpfs:
      - /tmp:size=48m,mode=1777
    mem_limit: 1250m
    memswap_limit: 1700m
    mem_reservation: 96m
    cpus: 0.8
    pids_limit: 96
    healthcheck:
      disable: true
    security_opt:
      - no-new-privileges:true
